# SRE Lab - local only. DEV CREDENTIALS ONLY. Never use these values anywhere real.
#
# Services:
#   db        PostgreSQL 16         port 5432  (named volume: pgdata)
#   minio     S3-compatible storage port 9000 API, 9001 console (named volume: miniodata)
#   minio-init one-shot: creates bucket + least-privilege user
#   upstream  mock paginated API    port 8081
#   api       Python HTTP API       port 8080
#   ui        nginx static UI       port 8088 (talks to api, never to db)
#
# Start:   docker compose up -d --build
# Status:  docker compose ps
# Logs:    docker compose logs -f api
# Stop:    docker compose down          (keeps volumes)
# Wipe:    docker compose down -v       (deletes data)

name: srelab

services:
  db:
    image: postgres:16-alpine
    container_name: srelab-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev-postgres-password   # DEV ONLY
      POSTGRES_DB: audiolab
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      # "ready" means: accepts connections for database audiolab
      test: ["CMD-SHELL", "pg_isready -U postgres -d audiolab"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks: [labnet]

  minio:
    # Built locally from source: MinIO stopped publishing community images in 2025.
    build:
      context: ./minio
      additional_contexts: { certs: ./certs }
    image: srelab-minio:RELEASE.2025-10-15T17-29-55Z
    container_name: srelab-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: dev-minio-root           # DEV ONLY (admin)
      MINIO_ROOT_PASSWORD: dev-minio-root-pass  # DEV ONLY
    volumes:
      - miniodata:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || curl -fsS http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks: [labnet]

  minio-init:
    build:                                             # same image as minio (cached), it contains mc
      context: ./minio
      additional_contexts: { certs: ./certs }
    image: srelab-minio:RELEASE.2025-10-15T17-29-55Z
    container_name: srelab-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/init/minio-init.sh"]
    environment:
      MINIO_ROOT_USER: dev-minio-root
      MINIO_ROOT_PASSWORD: dev-minio-root-pass
      S3_BUCKET: audiolab-raw
      APP_S3_ACCESS_KEY: dev-app-key            # DEV ONLY (least privilege user)
      APP_S3_SECRET_KEY: dev-app-secret-12345   # DEV ONLY
      RO_S3_ACCESS_KEY: dev-ro-key              # DEV ONLY (read-only user, used by incidents)
      RO_S3_SECRET_KEY: dev-ro-secret-12345     # DEV ONLY
    volumes:
      - ./scripts/minio-init.sh:/init/minio-init.sh:ro
    networks: [labnet]

  upstream:
    build: ./upstream
    container_name: srelab-upstream
    environment:
      UPSTREAM_PORT: "8081"
      UPSTREAM_TOTAL_SESSIONS: "250"
      UPSTREAM_PAGE_SIZE: "50"
      UPSTREAM_TOKEN: dev-upstream-token        # DEV ONLY
      UPSTREAM_FAIL_RATE: "0.0"                 # 0.0 .. 1.0 random 500s
      UPSTREAM_LATENCY_MS: "0"
      UPSTREAM_RATE_LIMIT_EVERY: "0"            # N>0 -> every Nth request gets 429
    ports:
      - "127.0.0.1:8081:8081"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8081/health',timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks: [labnet]

  api:
    build:
      context: ./api
      additional_contexts: { certs: ./certs }
    container_name: srelab-api
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      upstream:
        condition: service_healthy
    environment:
      APP_PORT: "8080"
      LOG_LEVEL: INFO
      # Least-privilege role. Not the postgres superuser.
      DATABASE_URL: postgresql://app_rw:dev-app-rw-password@db:5432/audiolab
      DB_POOL_MIN: "1"
      DB_POOL_MAX: "5"
      DB_POOL_TIMEOUT_S: "5"
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: dev-app-key
      S3_SECRET_KEY: dev-app-secret-12345
      S3_BUCKET: audiolab-raw
      S3_REGION: us-east-1
      UPSTREAM_URL: http://upstream:8081
      UPSTREAM_TOKEN: dev-upstream-token
      HTTP_TIMEOUT_S: "3"
      HTTP_MAX_RETRIES: "4"
      HTTP_BACKOFF_BASE_S: "0.2"
      HTTP_BACKOFF_MAX_S: "3"
      API_KEY: dev-api-key                      # DEV ONLY, required for POST endpoints
      INGEST_MAX_PAGES: "20"
      INGEST_IDEMPOTENT: "true"
      READY_CHECK_S3: "true"
      SWALLOW_INGEST_ERRORS: "false"
      METRICS_ENABLED: "true"
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8080/ready',timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 10
      start_period: 10s
    networks: [labnet]

  ui:
    image: nginx:1.27-alpine
    container_name: srelab-ui
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./ui/index.html:/usr/share/nginx/html/index.html:ro
      - ./ui/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8088:80"
    networks: [labnet]

volumes:
  pgdata:
  miniodata:

networks:
  labnet:
    driver: bridge
